{% extends "base.html" %}

{% block title %}Setup Admin - Cache Server{% endblock %}

{% block breadcrumb %}
    <span class="sep">/</span> Admin
    <span class="sep">/</span> Setup
{% endblock %}

{% block content %}
<div class="card" style="max-width:400px;">
    <h2>First-Time Setup</h2>
    <p class="muted">No admin account exists. Create one to secure the admin panel.</p>
    <form method="post">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required autocomplete="new-password">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="password2" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Create Admin</button>
    </form>
</div>
{% endblock %}
