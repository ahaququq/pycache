# Nginx configuration for the cache server
# This is included by the main nginx.conf in the Docker image.

# Upstream Flask app (gunicorn)
upstream cache_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Cache zone for nginx's own proxy_cache (optional, for hot files)
# proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:10m max_size=1g inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Max upload size for admin module editor (though we limit in Flask too)
    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root for any static files nginx serves directly (we proxy everything to Flask)
    root /app/app/static;

    # Health check endpoint (nginx can hit this directly)
    location = /health {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Cache proxy: /cache/<path>
    location /cache/ {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering: let nginx buffer the response to disk so gunicorn can
        # release the worker quickly. Important for large files.
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        proxy_max_temp_file_size 2G;

        # Timeouts for large downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable nginx's own cache for now (we control caching in Python)
        # proxy_cache app_cache;
        # proxy_cache_valid 200 7d;
        # proxy_cache_key $request_uri;
    }

    # Admin panel: require auth (handled by Flask)
    location /admin/ {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Info pages
    location /info/ {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root redirect to /info
    location = / {
        return 302 /info;
    }

    # Static files (CSS, JS) served directly by nginx for speed
    location /static/ {
        alias /app/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback: everything else to Flask
    location / {
        proxy_pass http://cache_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}